# A release for every tag v* pushed (docs/UPDATES.md): the tag must be annotated and name the
# workspace's version; a draft release is made; package.yml builds each platform's bundle
# (macOS signed and notarized); each bundle is listed file by file, with a blob for each file no
# earlier release published; the manifest is written over them (and over the release's notes
# and media, release/notes/<version>.toml), signed with the NEWEN_UPDATE_SIGNING_KEY secret of
# the `release` environment, checked against the keys compiled into Newen, and only then is
# everything uploaded and the release published. Until then no copy can see it.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One release at a time per tag, never cancelled halfway.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.ref_name }}
  GH_REPO: ${{ github.repository }}

# Actions are pinned by commit, the release they were in beside it, as in rune's workflow.
jobs:
  draft:
    name: tag, version and draft
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # The checkout leaves the pushed tag lightweight; its annotation holds the notes and the
      # word «mandatory».
      - run: git fetch --force --tags origin
      # limn is a path dependency (Cargo.toml): its branch, beside this checkout.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Niiihuel/limn
          ref: quill/integration
          token: ${{ secrets.LIMN_READ_TOKEN || github.token }}
          path: limn-quill-integration
      - name: limn beside the workspace, where its path says
        run: ln -s "$PWD/limn-quill-integration" ../limn-quill-integration
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: the tag is annotated and names the workspace's version
        run: cargo run --locked --quiet -p newen-release -- tag "$TAG"
      - name: draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -l --format='%(contents)' "$TAG" > notes.md
          # A pre-release (v1.2.0-rc.1) never becomes the latest one, so installed copies never
          # see it.
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" --draft --verify-tag --title "Newen ${TAG#v}" \
            --notes-file notes.md "${prerelease[@]}"

  # Linux always; Windows and macOS once the owner turns them on (NEWEN_WINDOWS_RELEASES,
  # NEWEN_MACOS_RELEASES): a platform that is off is skipped and the release goes out without it.
  package:
    name: bundles
    needs: draft
    uses: ./.github/workflows/package.yml
    with:
      release: true
    secrets: inherit

  publish:
    name: signed manifest and publication
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # Its secret, the signing key, is the release environment's: only a v* tag reaches it,
    # once the owner approves the run (docs/UPDATES.md).
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # Every annotated tag: minimum_version comes from their messages.
      - run: git fetch --force --tags origin
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Niiihuel/limn
          ref: quill/integration
          token: ${{ secrets.LIMN_READ_TOKEN || github.token }}
          path: limn-quill-integration
      - name: limn beside the workspace, where its path says
        run: ln -s "$PWD/limn-quill-integration" ../limn-quill-integration
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Built before the secret is in the environment, so no build script ever runs with it.
      - run: cargo build --locked --quiet -p newen-release --bin newen-release
      # The bundles exactly as package.yml built them: the manifest is written over these files
      # and these files are what is uploaded.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: newen-*
          merge-multiple: true
          path: dist
      # The latest release published (its manifest, signatures and lists of files): this one's
      # sequence follows it, and its blobs are named instead of uploaded again. Verified with the
      # keys compiled in. Newen's manifest, or quill's for the release before Newen's first.
      - name: the release before
        run: |
          gh release download -D previous -p newen-update.json -p 'newen-update.json.sig*' \
            -p quill-update.json -p 'quill-update.json.sig*' -p 'files-*.json'
          ls -l previous
      # Each bundle unpacked as its archive holds it, to list it file by file.
      - name: bundles unpacked
        run: |
          test -f dist/newen-x86_64-linux.tar.gz
          mkdir -p tree/linux-x86_64
          tar -xzf dist/newen-x86_64-linux.tar.gz -C tree/linux-x86_64
          if [ -f dist/newen-x86_64-windows.zip ]; then
            mkdir -p tree/windows-x86_64
            unzip -q dist/newen-x86_64-windows.zip -d tree/windows-x86_64
          fi
          if [ -f dist/newen-aarch64-macos.zip ]; then
            mkdir -p tree/macos-aarch64
            unzip -q dist/newen-aarch64-macos.zip -d tree/macos-aarch64
          fi
      - name: manifest
        run: |
          artifacts=("linux-x86_64=dist/newen-x86_64-linux.tar.gz")
          [ -f dist/newen-x86_64-windows.zip ] && artifacts+=("windows-x86_64=dist/newen-x86_64-windows.zip")
          [ -f dist/newen-aarch64-macos.zip ] && artifacts+=("macos-aarch64=dist/newen-aarch64-macos.zip")
          # What the upload step sends: exactly the files the manifest names, and the new blobs.
          printf '%s\n' "${artifacts[@]#*=}" > dist/files.txt
          base="https://github.com/$GH_REPO/releases/download/$TAG"
          # The release's notes and media (release/notes/<version>.toml), when written: the
          # manifest names whats-new.json by digest, and it names each medium the same way.
          whats_new=()
          if [ -f "release/notes/${TAG#v}.toml" ]; then
            target/debug/newen-release whats-new "$TAG" "$base" dist >> dist/files.txt
            whats_new=(--whats-new dist/whats-new.json)
          fi
          trees=()
          for tree in tree/*; do trees+=("$(basename "$tree")=$tree"); done
          target/debug/newen-release files "$TAG" "$base" dist --previous previous "${trees[@]}" \
            >> dist/files.txt
          lists=()
          for tree in tree/*; do
            platform=$(basename "$tree")
            lists+=(--files "$platform=dist/files-$platform.json")
          done
          target/debug/newen-release manifest "$TAG" "$base" --previous previous "${whats_new[@]}" \
            "${lists[@]}" "${artifacts[@]}" > dist/newen-update.json
          cat dist/newen-update.json
      - name: sign
        env:
          NEWEN_UPDATE_SIGNING_KEY: ${{ secrets.NEWEN_UPDATE_SIGNING_KEY }}
        run: target/debug/newen-release sign dist/newen-update.json
      # With the keys compiled into Newen: a secret that does not match
      # crates/newen-update/release-key.pub (or backup-key.pub) stops the release here, and so
      # does a whats-new.json, medium, list or new blob in dist/ that is not what the manifest
      # names.
      - name: verify
        run: target/debug/newen-release verify dist/newen-update.json
      # The blobs in batches: the first release sends every file of every bundle.
      - name: upload and publish
        run: |
          mapfile -t files < dist/files.txt
          printf '%s\n' "${files[@]}" | xargs -n 50 gh release upload "$TAG" --clobber
          signatures=(dist/newen-update.json.sig)
          [ -f dist/newen-update.json.sigs ] && signatures+=(dist/newen-update.json.sigs)
          gh release upload "$TAG" dist/newen-update.json "${signatures[@]}" --clobber
          gh release edit "$TAG" --draft=false
