# A release for every tag v* pushed (docs/UPDATES.md): the tag must be annotated and name the
# workspace's version; a draft release is made; package.yml builds each platform's bundle
# (macOS signed and notarized); the manifest is written over them, signed with the
# QUILL_UPDATE_SIGNING_KEY secret, checked against the key compiled into quill, and only then
# are the bundles uploaded and the release published. Until that last step no quill can see it.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One release at a time per tag, never cancelled halfway.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.ref_name }}
  GH_REPO: ${{ github.repository }}

# Actions are pinned by commit, the release they were in beside it, as in rune's workflow.
jobs:
  draft:
    name: tag, version and draft
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # The checkout leaves the pushed tag lightweight; its annotation holds the notes and the
      # word «mandatory».
      - run: git fetch --force --tags origin
      # limn is a path dependency (Cargo.toml): its branch, beside this checkout.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Niiihuel/limn
          ref: quill/integration
          token: ${{ secrets.LIMN_READ_TOKEN || github.token }}
          path: limn-quill-integration
      - name: limn beside the workspace, where its path says
        run: ln -s "$PWD/limn-quill-integration" ../limn-quill-integration
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: the tag is annotated and names the workspace's version
        run: cargo run --locked --quiet -p quill-release -- tag "$TAG"
      - name: draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -l --format='%(contents)' "$TAG" > notes.md
          # A pre-release (v1.2.0-rc.1) never becomes the latest one, so installed copies never
          # see it.
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" --draft --verify-tag --title "quill ${TAG#v}" \
            --notes-file notes.md "${prerelease[@]}"

  # Linux always; Windows and macOS once the owner turns them on (QUILL_WINDOWS_RELEASES,
  # QUILL_MACOS_RELEASES): a platform that is off is skipped and the release goes out without it.
  package:
    name: bundles
    needs: draft
    uses: ./.github/workflows/package.yml
    with:
      release: true
    secrets: inherit

  publish:
    name: signed manifest and publication
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # Every annotated tag: minimum_version comes from their messages.
      - run: git fetch --force --tags origin
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Niiihuel/limn
          ref: quill/integration
          token: ${{ secrets.LIMN_READ_TOKEN || github.token }}
          path: limn-quill-integration
      - name: limn beside the workspace, where its path says
        run: ln -s "$PWD/limn-quill-integration" ../limn-quill-integration
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Built before the secret is in the environment, so no build script ever runs with it.
      - run: cargo build --locked --quiet -p quill-release --bin quill-release
      # The bundles exactly as package.yml built them: the manifest is written over these files
      # and these files are what is uploaded.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: quill-*
          merge-multiple: true
          path: dist
      - name: manifest
        run: |
          test -f dist/quill-x86_64-linux.tar.gz
          artifacts=("linux-x86_64=dist/quill-x86_64-linux.tar.gz")
          [ -f dist/quill-x86_64-windows.zip ] && artifacts+=("windows-x86_64=dist/quill-x86_64-windows.zip")
          [ -f dist/quill-aarch64-macos.zip ] && artifacts+=("macos-aarch64=dist/quill-aarch64-macos.zip")
          target/debug/quill-release manifest "$TAG" \
            "https://github.com/$GH_REPO/releases/download/$TAG" "${artifacts[@]}" \
            > dist/quill-update.json
          cat dist/quill-update.json
      - name: sign
        env:
          QUILL_UPDATE_SIGNING_KEY: ${{ secrets.QUILL_UPDATE_SIGNING_KEY }}
        run: target/debug/quill-release sign dist/quill-update.json
      # With the key compiled into quill: a secret that does not match
      # crates/quill-update/release-key.pub stops the release here.
      - name: verify
        run: target/debug/quill-release verify dist/quill-update.json
      - name: upload and publish
        run: |
          gh release upload "$TAG" dist/quill-*.tar.gz dist/quill-*.zip \
            dist/quill-update.json dist/quill-update.json.sig --clobber
          gh release edit "$TAG" --draft=false
