# A release for every tag v* pushed (docs/UPDATES.md): the tag must be annotated and name the
# workspace's version; a draft release is made; package.yml builds each platform's bundle
# (macOS signed and notarized); each bundle is listed file by file, with a blob for each file no
# earlier release published; the manifest is written over them (and over the release's notes
# and media, release/notes/<version>.toml), signed with the QUILL_UPDATE_SIGNING_KEY secret of
# the `release` environment, checked against the keys compiled into quill, and only then is
# everything uploaded and published: first in the public feed (Niiihuel/quill-releases, which
# quill reads from 0.1.9 on), then here (which quill up to 0.1.8 reads). Until then no quill
# can see it.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One release at a time per tag, never cancelled halfway.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.ref_name }}
  GH_REPO: ${{ github.repository }}
  # The public feed every release is published in too.
  FEED: Niiihuel/quill-releases

# Actions are pinned by commit, the release they were in beside it, as in rune's workflow.
jobs:
  draft:
    name: tag, version and draft
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # The checkout leaves the pushed tag lightweight; its annotation holds the notes and the
      # word «mandatory».
      - run: git fetch --force --tags origin
      # limn is a path dependency (Cargo.toml): its branch, beside this checkout.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Niiihuel/limn
          ref: quill/integration
          token: ${{ secrets.LIMN_READ_TOKEN || github.token }}
          path: limn-quill-integration
      - name: limn beside the workspace, where its path says
        run: ln -s "$PWD/limn-quill-integration" ../limn-quill-integration
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: the tag is annotated and names the workspace's version
        run: cargo run --locked --quiet -p quill-release -- tag "$TAG"
      - name: draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -l --format='%(contents)' "$TAG" > notes.md
          # A pre-release (v1.2.0-rc.1) never becomes the latest one, so installed copies never
          # see it.
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" --draft --verify-tag --title "quill ${TAG#v}" \
            --notes-file notes.md "${prerelease[@]}"

  # Linux always; Windows and macOS once the owner turns them on (QUILL_WINDOWS_RELEASES,
  # QUILL_MACOS_RELEASES): a platform that is off is skipped and the release goes out without it.
  package:
    name: bundles
    needs: draft
    uses: ./.github/workflows/package.yml
    with:
      release: true
    secrets: inherit

  publish:
    name: signed manifest and publication
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # Its secrets (the signing key, the feed's token) are the release environment's: only a v*
    # tag reaches them, once the owner approves the run (docs/UPDATES.md).
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Before anything is built: without it the release could not reach the public feed.
      - name: the public feed's token is there
        env:
          QUILL_RELEASES_TOKEN: ${{ secrets.QUILL_RELEASES_TOKEN }}
        run: |
          if [ -z "$QUILL_RELEASES_TOKEN" ]; then
            echo "the release environment has no QUILL_RELEASES_TOKEN secret (docs/UPDATES.md)" >&2
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # Every annotated tag: minimum_version comes from their messages.
      - run: git fetch --force --tags origin
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Niiihuel/limn
          ref: quill/integration
          token: ${{ secrets.LIMN_READ_TOKEN || github.token }}
          path: limn-quill-integration
      - name: limn beside the workspace, where its path says
        run: ln -s "$PWD/limn-quill-integration" ../limn-quill-integration
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Built before the secret is in the environment, so no build script ever runs with it.
      - run: cargo build --locked --quiet -p quill-release --bin quill-release
      # The bundles exactly as package.yml built them: the manifest is written over these files
      # and these files are what is uploaded.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: quill-*
          merge-multiple: true
          path: dist
      # The latest release published (its manifest, signatures and lists of files): this one's
      # sequence follows it, and its blobs are named instead of uploaded again. Verified with the
      # keys compiled in. The public feed's; while it has none, this repository's.
      - name: the release before
        env:
          QUILL_RELEASES_TOKEN: ${{ secrets.QUILL_RELEASES_TOKEN }}
        run: |
          patterns=(-p quill-update.json -p 'quill-update.json.sig*' -p 'files-*.json')
          if ! GH_TOKEN=$QUILL_RELEASES_TOKEN gh release download --repo "$FEED" -D previous \
            "${patterns[@]}"; then
            rm -rf previous
            gh release download -D previous "${patterns[@]}"
          fi
          ls -l previous
      # Each bundle unpacked as its archive holds it, to list it file by file.
      - name: bundles unpacked
        run: |
          test -f dist/quill-x86_64-linux.tar.gz
          mkdir -p tree/linux-x86_64
          tar -xzf dist/quill-x86_64-linux.tar.gz -C tree/linux-x86_64
          if [ -f dist/quill-x86_64-windows.zip ]; then
            mkdir -p tree/windows-x86_64
            unzip -q dist/quill-x86_64-windows.zip -d tree/windows-x86_64
          fi
          if [ -f dist/quill-aarch64-macos.zip ]; then
            mkdir -p tree/macos-aarch64
            unzip -q dist/quill-aarch64-macos.zip -d tree/macos-aarch64
          fi
      - name: manifest
        run: |
          artifacts=("linux-x86_64=dist/quill-x86_64-linux.tar.gz")
          [ -f dist/quill-x86_64-windows.zip ] && artifacts+=("windows-x86_64=dist/quill-x86_64-windows.zip")
          [ -f dist/quill-aarch64-macos.zip ] && artifacts+=("macos-aarch64=dist/quill-aarch64-macos.zip")
          # What the upload steps send: exactly the files the manifest names. Blobs go to the
          # public feed only (feed.txt); the rest to both.
          printf '%s\n' "${artifacts[@]#*=}" > dist/files.txt
          # Every address names the public feed; quill up to 0.1.8, reading this repository,
          # finds each file here by its name.
          base="https://github.com/$FEED/releases/download/$TAG"
          # The release's notes and media (release/notes/<version>.toml), when written: the
          # manifest names whats-new.json by digest, and it names each medium the same way.
          whats_new=()
          if [ -f "release/notes/${TAG#v}.toml" ]; then
            target/debug/quill-release whats-new "$TAG" "$base" dist >> dist/files.txt
            whats_new=(--whats-new dist/whats-new.json)
          fi
          trees=()
          for tree in tree/*; do trees+=("$(basename "$tree")=$tree"); done
          target/debug/quill-release files "$TAG" "$base" dist --previous previous "${trees[@]}" \
            > dist/listed.txt
          grep -v '/f-[0-9a-f]*\.gz$' dist/listed.txt >> dist/files.txt
          grep '/f-[0-9a-f]*\.gz$' dist/listed.txt > dist/feed.txt || true
          lists=()
          for tree in tree/*; do
            platform=$(basename "$tree")
            lists+=(--files "$platform=dist/files-$platform.json")
          done
          target/debug/quill-release manifest "$TAG" "$base" --previous previous "${whats_new[@]}" \
            "${lists[@]}" "${artifacts[@]}" > dist/quill-update.json
          cat dist/quill-update.json
      - name: sign
        env:
          QUILL_UPDATE_SIGNING_KEY: ${{ secrets.QUILL_UPDATE_SIGNING_KEY }}
        run: target/debug/quill-release sign dist/quill-update.json
      # With the keys compiled into quill: a secret that does not match
      # crates/quill-update/release-key.pub (or backup-key.pub) stops the release here, and so
      # does a whats-new.json, medium, list or new blob in dist/ that is not what the manifest
      # names.
      - name: verify
        run: target/debug/quill-release verify dist/quill-update.json
      # The public feed first: quill from 0.1.9 on reads it. Its release is made as a draft,
      # filled, then published as the latest (a pre-release never is).
      - name: upload and publish in the public feed
        env:
          GH_TOKEN: ${{ secrets.QUILL_RELEASES_TOKEN }}
        run: |
          git tag -l --format='%(contents)' "$TAG" > notes.md
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          if ! gh release view "$TAG" --repo "$FEED" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$FEED" --draft --target main \
              --title "quill ${TAG#v}" --notes-file notes.md "${prerelease[@]}"
          fi
          # The blobs in batches: the first release sends every file of every bundle.
          if [ -s dist/feed.txt ]; then
            xargs -n 50 gh release upload "$TAG" --repo "$FEED" --clobber < dist/feed.txt
          fi
          mapfile -t files < dist/files.txt
          signatures=(dist/quill-update.json.sig)
          [ -f dist/quill-update.json.sigs ] && signatures+=(dist/quill-update.json.sigs)
          gh release upload "$TAG" --repo "$FEED" --clobber "${files[@]}" \
            dist/quill-update.json "${signatures[@]}"
          latest=(--latest)
          [ ${#prerelease[@]} -gt 0 ] && latest=()
          gh release edit "$TAG" --repo "$FEED" --draft=false "${latest[@]}"
      # Then here, as before: quill up to 0.1.8 reads this repository's latest release.
      - name: upload and publish
        run: |
          mapfile -t files < dist/files.txt
          signatures=(dist/quill-update.json.sig)
          [ -f dist/quill-update.json.sigs ] && signatures+=(dist/quill-update.json.sigs)
          gh release upload "$TAG" "${files[@]}" \
            dist/quill-update.json "${signatures[@]}" --clobber
          gh release edit "$TAG" --draft=false
