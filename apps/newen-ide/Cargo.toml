[package]
name = "newen-ide"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "newen-ide: a native code reader and editor in Newen's look, drawn with limn."

[dependencies]
# Newen shows its files here, and code goes from here to its agents.
newen-link = { path = "../../crates/newen-link" }
# Tree-sitter's highlighting, which tells types, properties and functions apart.
limn = { workspace = true, features = ["syntax"] }
limn-egui.workspace = true
limn-editor.workspace = true
# Tree-sitter's folds and declarations, for folding, sticky scopes and the symbols' path.
limn-language = { path = "../../../limn-code-look/crates/limn-language" }
eframe.workspace = true
newen-components = { path = "../../crates/newen-components" }
# The tree's listing and its file operations, as Newen's.
newen-files = { path = "../../crates/newen-files" }
# The terminal's shells, as Newen runs them.
newen-pty = { path = "../../crates/newen-pty" }
# The folder's files as git sees them, for opening by name, as ripgrep does.
ignore = "0.4"
serde.workspace = true
serde_json.workspace = true
# The platform's own folder dialog, through the desktop portal (no GTK linked in), as Newen's.
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
# A line diff of a file against its last commit, for the gutter's marks.
similar = "2"

# newen-ide's icon in its Windows executable (build.rs), as Newen's.
[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1", default-features = false }
