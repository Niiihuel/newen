[package]
name = "newen-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Newen's durable record: every event a session showed, replayed at start."
publish = false

[dependencies]
newen-model = { path = "../newen-model" }
serde_json.workspace = true
# SQLite compiled in, so Newen needs no system library for its record.
rusqlite = { version = "0.37", features = ["bundled"] }

[dev-dependencies]
# A record on disk opened twice; already in the lock (newen-update's tests use it).
tempfile = "3"
