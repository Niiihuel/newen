[package]
name = "newen-capture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Records the stream-json and control protocol of the installed Claude Code CLI as fixtures (docs/plan.md Q1)."
publish = false

[dependencies]
serde_json.workspace = true
# Client-side message ids, as the SDK sends them.
uuid = { version = "1", features = ["v4"] }
# The ACP driver (acp.rs) drives each agent's CLI through Newen's own adapter, as the engine does.
newen-agent = { path = "../../crates/newen-agent" }
newen-agent-opencode = { path = "../../crates/newen-agent-opencode" }
newen-agent-hermes = { path = "../../crates/newen-agent-hermes" }
# Grok Build over ACP, the same way.
newen-agent-grok = { path = "../../crates/newen-agent-grok" }
# Google's Antigravity CLI over ACP, the same way.
newen-agent-antigravity = { path = "../../crates/newen-agent-antigravity" }
