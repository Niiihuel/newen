[package]
name = "quill-release"
description = "The owner's tools for quill's updates: the release signer and a local test feed; never part of the app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
default-run = "quill-release"

[[bin]]
name = "quill-release"
path = "src/release.rs"

[[bin]]
name = "quill-test-feed"
path = "src/test_feed.rs"

[dependencies]
# The manifest, its signature and versions as the app reads them; `serve` is the loopback file
# server the test feed answers from.
quill-update = { path = "../../crates/quill-update", features = ["serve"] }
# The same versions quill-update builds: nothing new is compiled.
serde_json.workspace = true
ed25519-dalek = { version = "2.2", default-features = false }
sha2 = "0.10"
base64 = "0.22"
# Checks that each new blob unpacks to its file; the version quill-update uses.
flate2 = "1.1"
# The new signing key, and the test feed's throwaway one.
getrandom = "0.3"
# The release notes the owner writes, release/notes/<version>.toml (docs/UPDATES.md), read
# into structs with serde's derive (the workspace's serde).
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }
serde.workspace = true

[dev-dependencies]
# A release's notes and media built in a temporary folder; already in the lock.
tempfile = "3"
